name: WW Monitor – Test Email (Sample Events)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pyyaml

      - name: Run monitor in SAMPLE mode (no send)
        env:
          SEND_MODE: GRAPH
          MAIL_FROM: "ww-monitor@itwfeg.com"
          MAIL_TO: "jaehan.kim@itwfeg.com"
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          SAMPLE_EVENTS: "1"
        run: |
          set -e
          python monitor_warewashing.py
          # sanity check
          test -s preview.html && echo "preview.html created"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ww-monitor-preview
          path: preview.html
