
name: WW Monitor – Test Email (Sample Events)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pyyaml

      - name: Run monitor in SAMPLE mode (no send)
        env:
          SEND_MODE: GRAPH
          MAIL_FROM: "ww-monitor@itwfeg.com"
          MAIL_TO: "jaehan.kim@itwfeg.com"
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          SAMPLE_EVENTS: "1"
        run: |
          set +e  # do NOT stop the job if python returns non-zero
          python monitor_warewashing.py | tee monitor_output.txt
          echo "Python exit code: $?"
          # If preview.html not created, try to build it from logs as a fallback
          if [ ! -s preview.html ]; then
            echo "preview.html not found — attempting to extract from logs"
            awk '/=== HTML BODY ===/{flag=1;next} flag{print}' monitor_output.txt > preview.html
          fi
          # At this point, preview.html may still be empty if script produced no HTML.
          if [ -s preview.html ]; then
            echo "preview.html ready"
          else
            echo "WARNING: preview.html is empty. Check logs for HTML markers."
          fi

      - name: Upload preview artifact (always run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-monitor-preview
          path: preview.html
