name: WW Monitor – Bootstrap Archive (one-time, DEBUG)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ww-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Show git status
        run: |
          git rev-parse --abbrev-ref HEAD
          git status --porcelain

      - name: Print URLs configuration
        run: |
          echo "=== config/urls.yaml ==="
          cat config/urls.yaml || echo "config/urls.yaml not found!"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache: 'pip'   # <-- removed to avoid error

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml

      - name: Bootstrap full PDF archive (no email) — DEBUG
        env:
          BOOTSTRAP_ARCHIVE: "1"
          SEND_MODE: GRAPH
          WRITE_PREVIEW: "0"

          # Debug flags (turn OFF after validation)
          LOG_LINKS: "1"
          ARCHIVE_ALL_PDFS: "1"

          # Optional Graph secrets (ignored during bootstrap exit)
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}

          # Provided by Actions
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          python monitor_warewashing.py

      - name: Show tree after run
        if: always()
        run: |
          echo "==== repo root ===="
          ls -la
          echo "==== archive tree (first 200 files) ===="
          if [ -d archive ]; then
            find archive -type f | head -n 200
          else
            echo "archive/ does not exist"
          fi
          echo "==== sqlite state ===="
          if [ -f state.db ]; then
            ls -la state.db
          else
            echo "state.db not found"
          fi

      - name: Upload archived PDFs + DB (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-bootstrap-archives
          path: |
            archive/**/*
            state.db
          if-no-files-found: warn

      - name: Done
        run: echo "Bootstrap (DEBUG) finished."
