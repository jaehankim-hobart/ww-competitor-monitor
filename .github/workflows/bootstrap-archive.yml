# .github/workflows/bootstrap.yml
name: Bootstrap Archive with Baseline Reports

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml pandas scikit-learn joblib PyPDF2

      - name: Run bootstrap crawl and archive
        env:
          BOOTSTRAP_ARCHIVE: "1"
          ARCHIVE_ALL_PDFS: "1"
        run: |
          python monitor_warewashing.py

      # Build a baseline manifest/pivot from whatever was archived
      - name: Classify (rules) — baseline
        continue-on-error: true
        run: |
          python -m classifier.rules

      - name: ML fallback — baseline
        continue-on-error: true
        run: |
          python -m classifier.ml_fallback

      - name: Build pivot — baseline
        continue-on-error: true
        run: |
          python -m reporting.build_reports

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-reports
          path: |
            output/manifest.csv
            output/report_by_product_line.csv
