
name: WW Monitor – Bootstrap Archive (one-time)

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Enable verbose logs and archive ALL PDFs (for diagnostics)"
        type: boolean
        default: true
        required: true
      archive_all_pdfs:
        description: "Force-archive any .pdf found (ignores classification)"
        type: boolean
        default: true
        required: true
      log_links:
        description: "Print first 30 links found per page"
        type: boolean
        default: true
        required: true
      ua_override:
        description: "Optional browser-like User-Agent"
        type: string
        default: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
        required: false

permissions:
  contents: write

concurrency:
  group: ww-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Show git status
        run: |
          git rev-parse --abbrev-ref HEAD
          git status --porcelain

      - name: Print URLs configuration
        run: |
          echo "=== config/urls.yaml ==="
          cat config/urls.yaml || echo "config/urls.yaml not found!"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml

      - name: Bootstrap full PDF archive (no email)
        env:
          # Core behavior
          BOOTSTRAP_ARCHIVE: "1"
          SEND_MODE: GRAPH
          WRITE_PREVIEW: "0"
          # Debug toggles from inputs
          ARCHIVE_ALL_PDFS: ${{ inputs.archive_all_pdfs && '1' || '0' }}
          LOG_LINKS:        ${{ inputs.log_links && '1' || '0' }}
          DEBUG_LOG:        ${{ inputs.debug_mode && '1' || '0' }}
          UA_OVERRIDE:      ${{ inputs.ua_override }}
          # Optional Graph secrets (safe even if not set; bootstrap exits before send)
          GRAPH_TENANT_ID:     ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID:     ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          # Provided by Actions
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          GITHUB_ACTIONS:    "true"
        run: |
          set -euo pipefail
          python monitor_warewashing.py

      - name: Show tree after run
        if: always()
        run: |
          echo "==== repo root ===="
          ls -la
          echo "==== archive tree (first 200 files) ===="
          if [ -d archive ]; then
            find archive -type f | head -n 200
          else
            echo "archive/ does not exist"
          fi
          echo "==== sqlite state ===="
          if [ -f state.db ]; then
            ls -la state.db
          else
            echo "state.db not found"
          fi

      - name: Upload archived PDFs + DB (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-bootstrap-archives
          path: |
            archive/**/*
            state.db
          if-no-files-found: warn

      - name: Done
        run: echo "Bootstrap finished. Inspect artifacts and commit in the repo history."
