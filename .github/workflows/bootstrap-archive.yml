
name: WW Monitor – Bootstrap Archive (one-time, DEBUG)

on:
  # Manual trigger from the Actions tab
  workflow_dispatch: {}

permissions:
  contents: write

# Prevent overlapping runs for safety
concurrency:
  group: ww-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1) Checkout with full history and credentials so we can push archived PDFs
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true  # Use GITHUB_TOKEN for push

      # 2) Show git status (handy if you branch or restrict pushes)
      - name: Show git status
        run: |
          git rev-parse --abbrev-ref HEAD
          git status --porcelain

      # 3) Print seeds so we can confirm what the script will crawl
      - name: Print URLs configuration
        run: |
          echo "=== config/urls.yaml ==="
          cat config/urls.yaml || echo "config/urls.yaml not found!"

      # 4) Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 5) Install required Python libs (requests/bs4/lxml/yaml)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml

      # 6) Run the monitor in BOOTSTRAP mode (DEBUG)
      #    BOOTSTRAP_ARCHIVE=1:
      #      - crawls all seeds
      #      - finds PDFs (debug version also picks up cross-host & raw HTML references)
      #      - archives them under ./archive/...
      #      - commits/pushes files (script calls git add/commit/push)
      #      - EXITS without sending email
      #
      #    LOG_LINKS=1           -> print first 30 links from each page
      #    ARCHIVE_ALL_PDFS=1    -> archive ANY .pdf discovered (ignores label filters)
      - name: Bootstrap full PDF archive (no email) — DEBUG
        env:
          # Core runtime behavior
          BOOTSTRAP_ARCHIVE: "1"    # one-time full archive mode
          SEND_MODE: GRAPH          # irrelevant here; script exits before send
          WRITE_PREVIEW: "0"        # no preview during bootstrap

          # Debug flags (turn OFF after validation)
          LOG_LINKS: "1"
          ARCHIVE_ALL_PDFS: "1"

          # Optional Graph secrets (ignored in bootstrap exit, but harmless)
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}

          # Provided by Actions (script reads these to build raw URLs and detect actions context)
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          python monitor_warewashing.py

      # 7) Show what's on disk (helps confirm we actually produced files)
      - name: Show tree after run
        if: always()
        run: |
          echo "==== repo root ===="
          ls -la
          echo "==== archive tree (first 200 files) ===="
          if [ -d archive ]; then
            find archive -type f | head -n 200
          else
            echo "archive/ does not exist"
          fi
          echo "==== sqlite state ===="
          if [ -f state.db ]; then
            ls -la state.db
          else
            echo "state.db not found"
          fi

      # 8) Upload the archived files and DB as an artifact for inspection
      - name: Upload archived PDFs + DB (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-bootstrap-archives
          path: |
            archive/**/*
            state.db
          if-no-files-found: warn

      # 9) Final log
      - name: Done
        run: echo "Bootstrap (DEBUG) finished. All discovered PDFs should be under ./archive and pushed to the repo."
