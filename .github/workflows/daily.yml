
# .github/workflows/daily.yml
name: Daily Crawl • Classify • Email

on:
  schedule:
    - cron: "15 7 * * *"   # daily at 07:15
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml pandas scikit-learn joblib PyPDF2 msal

      # Crawl (writes PDFs into archive/**, commits/pushes archives)
      - name: Crawl competitors
        env:
          # Optional: control behavior
          ARCHIVE_ALL_PDFS: "0"
        run: |
          python monitor_warewashing.py

      # The updated monitor_warewashing already tries to run the post-crawl pipeline
      # and attach files when sending. If you prefer to run it explicitly, you can add:
      - name: Classify (rules) — explicit
        run: |
          python -m classifier.rules

      - name: ML fallback — explicit
        run: |
          python -m classifier.ml_fallback

      - name: Build pivot — explicit
        run: |
          python -m reporting.build_reports

      # If you want to send the email from the workflow (instead of from the script),
      # uncomment the next step and disable sending inside monitor_warewashing.py
      # by setting SEND_MODE=NONE or similar.
      - name: Email report via Graph (optional if not sending in script)
        if: ${{ false }}  # set to true if you move sending here
        env:
          GRAPH_TENANT_ID: ${{ secrets.TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAIL_TO: "jaehan.kim@yourco.com"
        run: |
          python email_graph.py \
            --to "$MAIL_TO" \
            --subject "WW Competitor Monitor — $(date +'%Y-%m-%d')" \
            --attach output/manifest.csv \
            --attach output/report_by_product_line.csv
