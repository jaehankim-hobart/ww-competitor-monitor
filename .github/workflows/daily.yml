name: WW Daily Monitor (7AM ET)

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 7 AM ET during Standard Time (EST = UTC-5)
    - cron: "0 11 * * 1-5"   # 7 AM ET during Daylight Time (EDT = UTC-4)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install requests beautifulsoup4 lxml pyyaml pytz

    - name: Time guard (7:00–7:05 ET)
      run: |
        python - << 'PY'
        from datetime import datetime
        import pytz, sys
        tz = pytz.timezone("America/New_York")
        now = datetime.now(tz)
        if not (now.hour == 7 and now.minute < 5):
            print(f"Skipping run at {now.isoformat()}: not within 7:00–7:05 ET.")
            sys.exit(0)
        PY

    - name: Run competitor monitor
      env:
        SEND_MODE: GRAPH
        MAIL_FROM: "ww-monitor@itwfeg.com"
        MAIL_TO: "jaehan.kim@itwfeg.com"
        GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
        GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
        GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      run: python monitor_warewashing.py
