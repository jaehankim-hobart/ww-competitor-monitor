
# .github/workflows/daily.yml
name: Daily Crawl • Classify • Email

on:
  schedule:
    - cron: "15 7 * * *"  # NOTE: UTC time. 07:15 UTC = 02:15/03:15 US Eastern depending on DST.
  workflow_dispatch:

permissions:
  contents: write     # needed to push archived PDFs back to repo
  actions: read

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # allows git push via GITHUB_TOKEN

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"   # <-- add this

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml pandas scikit-learn joblib PyPDF2 msal cloudscraper
          
      # --- MAIN SCRIPT: crawl + archive + compose email (prints if no Graph creds) ---
      - name: Crawl, archive, classify, and compose email (no-send if no creds)
        env:
          # Optional toggles; safe defaults while stabilizing:
          ARCHIVE_ALL_PDFS: "0"
          DEBUG_LOG: "1"          
          WRITE_PREVIEW: "1"
          USE_CLOUDSCRAPER: "1"   # <— enable fallback client for this run

          # Email-related envs; script will SKIP sending if any are missing:
          GRAPH_TENANT_ID: ${{ secrets.TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAIL_TO: ${{ secrets.MAIL_TO }}  # optional; script has a default
        run: |
          python monitor_warewashing.py

      # --- OPTIONAL: run classifier pipeline explicitly (your script already does this) ---
      # Enable these only if you disable the in-script pipeline.
      # - name: Classify (rules) — explicit
      #   run: python -m classifier.rules
      #
      # - name: ML fallback — explicit
      #   run: python -m classifier.ml_fallback
      #
      # - name: Build pivot — explicit
      #   run: python -m reporting.build_reports

      # Upload reports and preview when email is not sent (no creds),
      # so you can still inspect results from the Actions UI.
      - name: Upload outputs (manifest & pivot) if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-monitor-outputs
          path: |
            output/manifest.csv
            output/manifest.rules.csv
            output/report_by_product_line.csv          
            output/all_pdfs.csv
            output/run_pdf_events.csv
            preview.html
          if-no-files-found: ignore
      
      - name: Upload debug HTML (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-debug-html
          path: output/debug
          if-no-files-found: ignore



