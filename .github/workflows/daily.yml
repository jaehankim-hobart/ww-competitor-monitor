
# .github/workflows/daily.yml
name: WW Competitor Monitor – Daily + Weekly Digest

on:
  schedule:
    - cron: "15 7 * * *"     # Daily run (07:15 UTC)
    - cron: "30 7 * * WED"   # Weekly digest run (07:30 UTC every Wednesday)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ww-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ARCHIVE_ALL_PDFS: "0"
      DEBUG_LOG: "0"
      WRITE_PREVIEW: "1"
      USE_CLOUDSCRAPER: "1"

      GRAPH_TENANT_ID: ${{ secrets.TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      ###################################################################
      # CHECKOUT
      ###################################################################
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      ###################################################################
      # RESTORE PERSISTENT STATE (state.db + archive/)
      ###################################################################
      - name: Restore DB Cache
        id: dbcache
        uses: actions/cache@v4
        with:
          path: state.db
          key: ww-monitor-db

      - name: Restore Archive Cache
        id: archivecache
        uses: actions/cache@v4
        with:
          path: archive
          key: ww-monitor-archive

      ###################################################################
      # PYTHON SETUP
      ###################################################################
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml pandas scikit-learn joblib PyPDF2 msal cloudscraper

      ###################################################################
      # DAILY CRAWL
      ###################################################################
      - name: Daily crawl + archive + email (only if updates exist)
        if: github.event.schedule == '15 7 * * *'
        run: |
          python monitor_warewashing.py

      ###################################################################
      # WEEKLY DIGEST CRAWL
      ###################################################################
      - name: Weekly digest crawl + always send weekly email
        if: github.event.schedule == '30 7 * * WED'
        env:
          SEND_WEEKLY: "1"
        run: |
          python monitor_warewashing.py

      ###################################################################
      # Manual button run in GitHub Actions UI
      ###################################################################
      - name: Manual trigger run
        if: github.event_name == 'workflow_dispatch'        
        env:
          SEND_WEEKLY: "1"
        run: python monitor_warewashing.py


      ###################################################################
      # SAVE UPDATED STATE
      ###################################################################
      - name: Save updated DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.db
          key: ww-monitor-db

      - name: Save updated Archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive
          key: ww-monitor-archive

      ###################################################################
      # ARTIFACTS — MANIFEST, REPORTS, PREVIEW
      ###################################################################      
      - name: Upload outputs (manifest, pivot, PDF lists)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ww-monitor-outputs
          path: output/**
          if-no-files-found: ignore

      - name: Upload debug HTML (tile extractions, snapshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-debug-html
          path: output/debug
          if-no-files-found: ignore
