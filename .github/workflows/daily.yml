
# .github/workflows/daily.yml
name: WW Competitor Monitor – Daily + Weekly Digest

on:
  schedule:
    - cron: "15 7 * * *"     # Daily run (07:15 UTC)
    - cron: "30 7 * * FRI"   # Weekly digest run (07:30 UTC every Friday)
  workflow_dispatch:

permissions:
  contents: write     # needed for git push of archived PDFs
  actions: read

concurrency:
  group: ww-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ARCHIVE_ALL_PDFS: "0"
      DEBUG_LOG: "0"
      WRITE_PREVIEW: "1"
      USE_CLOUDSCRAPER: "1"

      # Graph email credentials
      GRAPH_TENANT_ID: ${{ secrets.TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml pandas scikit-learn joblib PyPDF2 msal cloudscraper

      #######################################################################
      # DAILY RUN (default)
      #######################################################################
      - name: Daily crawl + archive + email (only if updates exist)
        if: github.event.schedule == '15 7 * * *'
        run: |
          python monitor_warewashing.py

      #######################################################################
      # WEEKLY DIGEST RUN
      #######################################################################
      - name: Weekly digest crawl + always send weekly email
        if: github.event.schedule == '30 7 * * FRI'
        env:
          SEND_WEEKLY: "1"        # <---- THIS triggers weekly-mode behavior
        run: |
          python monitor_warewashing.py

      #######################################################################
      # Upload artifacts for inspection
      #######################################################################
      - name: Upload outputs (manifest, pivot, PDF lists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-monitor-outputs
          path: |
            output/manifest.csv
            output/manifest.rules.csv
            output/report_by_product_line.csv
            output/all_pdfs.csv
            output/run_pdf_events.csv
            preview.html
          if-no-files-found: ignore

      - name: Upload debug HTML (tile extractions, snapshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-debug-html
          path: output/debug
          if-no-files-found: ignore
