
Champion:
  # Restrict to true product PDFs only
  pdf_accept_all: false

  host_allow:
    - "^www\\.championindustries\\.com$"

  # Block known junk / slow directories
  path_block:
    - "^/(blog|news|events|press|privacy|terms|warranty|service|support|contact|search|sitemap)(/|$)"
    - "^/wp-content/"
    - "\\.(jpg|jpeg|png|gif|svg|webp)(\\?.*)?$"
    - "^/content/equipment-start-up-forms/"

  # Product pages only → dramatically reduces crawl
  page_allow:
    - "^/our-products/(door-type|undercounter-dishwashers|pot-pan.*|rack-conveyors|flight-machines)/?$"
    - "^/content/(spec-sheets|brochures|data-sheets|manuals|ops|operations|cleaning)/"
    - "^/product/[A-Za-z0-9][A-Za-z0-9-]{2,}/?$"

  # Champion PDFs only from first-party domain
  pdf_host_allow:
    - "^www\\.championindustries\\.com$"

  # PDF → product line hints
  pdf_path_line_hints:
    Door Type: "(?i)/door-type/"
    Undercounter: "(?i)/undercounter-dishwashers/"
    Prep Washer: "(?i)/pot[-_ ]?pan/"
    Rack Conveyor: "(?i)/rack-conveyors/"
    Flight Type: "(?i)/flight-machines/"

  # Refined tile selectors
  tile_selectors:
    - ".product-card a"
    - ".cards .card a"

Jackson:
  pdf_host_allow:
    - "jacksonwws.com"
    - "www.jacksonwws.com"

  # Keep to key product/category pages only
  page_allow:
    - "^/products/"
    - "^/wp-content/uploads/"     # for direct PDF pages
    - "^/categories/(high-temp|low-temp|undercounters|conveyors-good-better-best)/"

  pdf_path_line_hints:
    Rack Conveyor: "(?i)rackstar|rack[-_]?conveyor"
    Flight Type: "(?i)flightstar|flight-type"
    Door Type: "(?i)door[-_ ]?type"
    Undercounter: "(?i)undercounter"

  tile_selectors:
    - ".product-card a"


CMA:
  pdf_host_allow:
    - "cmadishmachines.com"
    - "www.cmadishmachines.com"

  # Avoid crawling every WP blog/permalink page
  path_block:
    - "^/wp-json/"
    - "^/wp-content/uploads/(20..|19..)/"  # allow direct PDFs but not HTML wrappers

  page_allow:
    - "^/products/"
    - "^/product/"

  pdf_path_line_hints:
    Rack Conveyor: "(?i)est[-_]?(44|66)"
    Door Type: "(?i)180"
    Undercounter: "(?i)uc(50e|65e)"
    Prep Washer: "(?i)pot[-_ ]?washer|scullery"

  tile_selectors:
    - ".product a"
    - "h3.entry-title a"


ADS:
  pdf_host_allow:
    - "americandish.com"
    - "www.americandish.com"

  page_allow:
    - "^/product/"
    - "^/dish-machines/"

  pdf_path_line_hints:
    Rack Conveyor: "(?i)ADC-(44|66)"
    Undercounter: "(?i)ET-AF|HUB-40"
    Door Type: "(?i)AF|AFC|HT-25|HT-34|L-series|5-CD|5-AG"
    Prep Washer: "(?i)pot[-_ ]?washer"

  tile_selectors:
    - ".product__title a"


Meiko:
  pdf_host_allow:
    - "meiko.com"
    - "www.meiko.com"

  # restrict pages to only products & downloads
  page_allow:
    - "^/en-us/products/"
    - "^/en-us/knowledge-base/downloads"
    - "^/en/downloads-media/downloads"

  tile_selectors:
    - ".m-teaser a"
    - ".card a"

  pdf_path_line_hints:
    Undercounter: "(?i)undercounter.*(m-iclean|upster)"
    Door Type: "(?i)hood-type|door-type"
    Rack Conveyor: "(?i)rack.*(ka|upster-k)"
    Flight Type: "(?i)flight-type|m-iq-flight"
    Prep Washer: "(?i)(utensil|pot|pan).*washer"


Moyer Diebel:
  pdf_host_allow:
    - "moyerdiebel.com"
    - "www.moyerdiebel.com"

  page_allow:
    - "^/product/"
    - "^/undercounter-dishwashers/"
    - "^/rack-conveyors/"
    - "^/spec-sheet-library/"

  tile_selectors:
    - ".product a"

  pdf_path_line_hints:
    Rack Conveyor: "(?i)MD(44|66)"
    Door Type: "(?i)MDHHD|MD2000"
    Undercounter: "(?i)201(LT|HT)|383HT|601(HRG|HTG|LTG)|glass"


Douglas:
  pdf_host_allow:
    - "dougmac.com"
    - "www.dougmac.com"

  # Only product pages
  page_allow:
    - "^/industrial-washers/"
    - "^/product/"

  pdf_path_line_hints:
    Prep Washer: "(?s).*"   # all PDFs → prep washer


LVO:
  pdf_host_allow:
    - "lvomfg.com"
    - "www.lvomfg.com"

  page_allow:
    - "^/site/product/"
    - "^/site/product-category/"

  tile_selectors:
    - ".products .product a"

  pdf_path_line_hints:
    Prep Washer: "(?i)/product/(fl|pt|pl)\\d+"
