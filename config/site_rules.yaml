
Champion:
  # Archive every PDF from Champion while we stabilize discovery/classification.
  # Turn this off later if you want only spec/brochure/datasheet types.
  pdf_accept_all: true

  host_allow:
    - "^www\\.championindustries\\.com$"

  # Block clearly-nonproduct areas and heavy assets
  path_block:
    - "^/(?:blog|news|events|press|privacy|terms|warranty|service|support|contact|search|sitemap)(/|$)"
    - "^/wp-content/"
    - "\\.(?:jpg|jpeg|png|gif|svg|webp)(?:\\?.*)?$"

  # What HTML pages are OK to follow from the seeds (same host only)
  page_allow:
    # Category landers (your seeds already point here)
    - "^/our-products/(?:door-type|undercounter-dishwashers|pot-pan|rack-conveyors|flight-machines)/?$"
    # Flat product detail pages: single slug after root
    - "^/[A-Za-z0-9][A-Za-z0-9-]{4,}/?$"
    # Also allow 2–3 segment paths (some sites use nested slugs)
    - "^/[A-Za-z0-9][A-Za-z0-9-]{2,}(?:/[A-Za-z0-9-]{2,}){1,2}/?$"

  # Restrict Champion PDFs to first-party domain (extend if they use a CDN)
  pdf_host_allow:
    - "^www\\.championindustries\\.com$"

  # Deterministic line classification from your URL substrings
  line_patterns:
    Door Type:
      - "(?i)Door-Type-Dishwashing-Machine"
    Undercounter:
      - "(?i)Undercounter-Dishwashing-Machine"
    Prep Washer:
      - "(?i)Door-Type-Pot-Pan-and-Utensil-Washer"
    Rack Conveyor:
      - "(?i)Tank-Rack-Conveyor"
    Flight Type:
      - "(?i)flight-conveyor-series/"

  # Optional: add folder hints later if Champion's PDFs use distinct directories
  pdf_path_line_hints: {}
