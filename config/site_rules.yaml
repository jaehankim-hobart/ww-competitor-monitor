
# config/site_rules.yaml
Champion:
  host_allow:
    - "^www\\.championindustries\\.com$"

  # Block clearly-nonproduct areas and heavy assets
  path_block:
    - "^/(?:blog|news|events|press|privacy|terms|warranty|service|support|contact|search|sitemap)(/|$)"
    - "^/wp-content/"
    - "\\.(?:jpg|jpeg|png|gif|svg|webp)(?:\\?.*)?$"

  # What HTML pages are OK to follow from the seeds (same host only)
  page_allow:
    # Category landers (your current seeds already point here)
    - "^/our-products/(?:door-type|undercounter-dishwashers|pot-pan|rack-conveyors|flight-machines)/?$"
    # Flat product detail pages: single slug after root like /DH3000-Door-Type-Dishwashing-Machine
    - "^/[A-Za-z0-9][A-Za-z0-9-]{4,}$"

  # Restrict Champion PDFs to first-party domain (extend if they use CDN)
  pdf_host_allow:
    - "^www\\.championindustries\\.com$"

  # === Product-line mapping rules (from your message) ===
  # We’ll match against URL (and anchor/page text as fallback).
  line_patterns:
    Door Type:
      - "(?i)Door-Type-Dishwashing-Machine"
    Undercounter:
      - "(?i)Undercounter-Dishwashing-Machine"
    Prep Washer:
      - "(?i)Door-Type-Pot-Pan-and-Utensil-Washer"
    Rack Conveyor:
      - "(?i)Tank-Rack-Conveyor"
    Flight Type:
      - "(?i)flight-conveyor-series/"

  # Optional bonus: if their public PDF folders encode line hints, add here later.
  pdf_path_line_hints: {}
