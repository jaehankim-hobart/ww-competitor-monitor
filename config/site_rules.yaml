
Champion:
  # While stabilizing, you can leave this on. Once you're happy with coverage,
  # set to false to only archive recognized doc types (spec/brochure/datasheet) from code.
  pdf_accept_all: true

  # Only crawl within first-party host
  host_allow:
    - "^www\\.championindustries\\.com$"

  # Skip non-product and heavy assets paths
  path_block:
    - "^/(?:blog|news|events|press|privacy|terms|warranty|service|support|contact|search|sitemap)(/|$)"
    - "^/wp-content/"
    - "\\.(?:jpg|jpeg|png|gif|svg|webp)(?:\\?.*)?$"

  # Product/category pages to follow (same-host)
  page_allow:
    # Category landers (these are your seeds)
    - "^/our-products/(?:door-type|undercounter-dishwashers|pot-pan|rack-conveyors|flight-machines)/?$"
    # Product-level slugs
    - "^/[A-Za-z0-9][A-Za-z0-9-]{4,}/?$"
    # 2–3 segment product paths
    - "^/[A-Za-z0-9][A-Za-z0-9-]{2,}(?:/[A-Za-z0-9-]{2,}){1,2}/?$"

  # Restrict Champion PDFs to first-party
  pdf_host_allow:
    - "^www\\.championindustries\\.com$"

  # ---------- Strong URL/path folder hints for classification ----------
  # These fire with high confidence (0.90) as soon as the PDF URL contains the hint.
  pdf_path_line_hints:
    Door Type: "(?i)/our-products/door-type/"
    Undercounter: "(?i)/our-products/undercounter-dishwashers/"
    Prep Washer: "(?i)/our-products/pot-pan/"
    Rack Conveyor: "(?i)/our-products/rack-conveyors/"
    Flight Type: "(?i)/our-products/flight-machines/"

  # ---------- Text patterns searched across (url + anchor_text + page_text) ----------
  # Use site-native terms to reinforce global logic and avoid accidental matches.
  line_patterns:
    Flight Type:
      # Your override: EUCC/EUCCW families belong to Flight
      - "(?i)\\bEUCCW?\\b"
      - "(?i)\\bPRO\\s*Flight\\b"
      - "(?i)\\bE\\s*Series\\s*Flight\\b"
      - "(?i)\\bFlight\\s*Machine\\b"
      - "(?i)\\bFlight\\s*Type\\b"

    Rack Conveyor:
      # Champion PRO conveyor families — allow trailing variants (FF/HR/VHR/HD/Steam)
      - "(?i)\\b(44|54|64|66|76|80|86|90)\\s*PRO\\b.*"
      # Loader/Unloader docs
      - "(?i)\\bPRO\\s*90B\\b"
      # Weaker fallback (textual)
      - "(?i)rack\\s*conveyor"

    Door Type:
      - "(?i)\\b(DH|DL)\\s*\\d"
      - "(?i)\\bHood\\s*Type\\b"
      - "(?i)\\bTall\\s*Hood\\b"
      - "(?i)\\bDoor\\s*Type\\b"

    Undercounter:
      # Glasswashers are considered undercounter for reporting
      - "(?i)\\bGlasswasher(s)?\\b"
      - "(?i)\\bCG[0-9 ]*\\b"
      - "(?i)\\bU(H|L|HM|HB)\\s*\\d{2,4}[A-Z]?\\b"
      - "(?i)\\bUCC(W)?\\b"
      - "(?i)\\bUndercounter\\b"

    Prep Washer:
      - "(?i)\\bPP\\b"
      - "(?i)\\bPP\\s*\\d+\\b"
      - "(?i)\\bPot\\s*&?\\s*Pan\\b"
      - "(?i)\\bP524\\b"


Jackson:
  # Allow PDFs from the main site and its media host(s) (adjust if they use a CDN)
  pdf_host_allow:
    - "jacksonwws.com"
    - "www.jacksonwws.com"

  # Pages we consider as product content (keeps crawl focused)
  page_allow:
    - "/products/"

  # ---------- Strong path hints for classification (high confidence) ----------
  # If a PDF URL or product path contains these slugs, we classify immediately.
  pdf_path_line_hints:
    Rack Conveyor: "(?i)rackstar|rack-star|/rack[-_]?conveyor"
    Flight Type: "(?i)flightstar|flight-star|/flight(?!\\s*recovery)"
    Door Type: "(?i)/door[-_ ]?type|/corner[-_ ]?and[-_ ]?door[-_ ]?type"
    Undercounter: "(?i)/undercounter"

  # ---------- Text patterns searched across (url + anchor_text + page_text) ----------
  # Brand-specific vocab that Jackson uses in names and marketing copy.
  line_patterns:
    Rack Conveyor:
      - "(?i)\\bRackStar\\b"
      - "(?i)\\bRS\\s*(44|66)\\b"         # model shorthand (if used)
      - "(?i)\\brack\\s*conveyor(s)?\\b"  # weaker/backup signal

    Flight Type:
      - "(?i)\\bFlightStar\\b"
      - "(?i)\\bflight\\s*type\\b"

    Door Type:
      - "(?i)\\bDyna\\s*Star\\b"
      - "(?i)\\bTemp\\s*Star\\b"
      - "(?i)\\bNXP\\b"
      - "(?i)\\bConserver\\b"
      - "(?i)\\bdoor\\s*type\\b"          # backup generic

    Undercounter:
      - "(?i)\\bDelta\\b"
      - "(?i)\\bDish\\s*Star\\b"
      - "(?i)\\bundercounter\\b"          # backup generic


ADS:
  # ADS = American Dish Service (americandish.com)
  # Allow first-party hosts (add CDN if you see PDFs under a separate domain)
  pdf_host_allow:
    - "americandish.com"
    - "www.americandish.com"

  # Keep crawl focused on product content
  page_allow:
    - "/dish-machines/"           # product index & category pages
    - "/product/"                 # individual product pages

  # ---------- Strong URL/path hints (high confidence classification) ----------
  pdf_path_line_hints:
    Rack Conveyor: "(?i)/conveyor|\\bADC-(44|66)\\b"
    Undercounter: "(?i)undercounter|\\bET[- ]?AF\\b|\\bHUB[- ]?40\\b"
    Door Type: "(?i)upright|/door|\\bAF\\b|\\bAFC\\b|\\bL[- ]?Series\\b|\\bAWS\\b|\\bHT[- ]?(25|34)\\b|\\b5[- ]?(CD|AG)\\b"
    Prep Washer: "(?i)pot[- ]?washer"   # ADS “Pot Washer Machine” -> your Prep Washer

  # ---------- Text patterns across (url + anchor_text + page_text) ----------
  line_patterns:
    Rack Conveyor:
      - "(?i)\\bADC[- ]?(44|66)\\b"           # conveyor models (ADC-44 / ADC-66)
      - "(?i)\\bconveyor\\b"
    Undercounter:
      - "(?i)\\bET[- ]?AF\\b"                 # ET-AF undercounter family
      - "(?i)\\bHUB[- ]?40\\b"                # HUB-40 undercounter
      - "(?i)\\bundercounter\\b"
    Door Type:
      - "(?i)\\bAF\\b|\\bAFC\\b"              # AF/AFC series (upright/door type)
      - "(?i)\\bL\\s*Series\\b"               # L Series
      - "(?i)\\bAWS(-H)?\\b"                  # AWS / AWS-H
      - "(?i)\\bHT[- ]?(25|34)\\b"            # HT-25 / HT-34
      - "(?i)\\b5[- ]?CD\\b|\\b5[- ]?AG(-S|-ES)?\\b"   # 5-CD, 5-AG(-S/-ES)
      - "(?i)\\bupright\\b|\\bdoor\\s*type\\b"        # safety net
    Prep Washer:
      - "(?i)\\bpot\\s*washer\\b"             # ADS calls it Pot Washer


CMA:
  # First-party host
  pdf_host_allow:
    - "cmadishmachines.com"
    - "www.cmadishmachines.com"

  # Product pages you want to follow
  page_allow:
    - "/products/"
    - "/product/"

  # High-confidence URL/path hints for classification
  pdf_path_line_hints:
    Rack Conveyor: "(?i)/product/model-est-(44|66)(-tall)?/|\\bEST[- ]?(44|66)\\b"
    Door Type: "(?i)/upright|/product/model-180|\\bCMA[- ]?180\\b"
    Undercounter: "(?i)/undercounter|/product/model-uc(50e|65e)|\\bUC(50E|65E)\\b|\\bL[- ]?1X\\b"
    Prep Washer: "(?i)pot[- ]?washer|scullery|pot\\s*&\\s*pan"

  # Brand terms searched across (url + anchor_text + page_text)
  line_patterns:
    Rack Conveyor:
      - "(?i)\\bEST[- ]?(44|66)\\b"
      - "(?i)\\bconveyor\\b"
    Door Type:
      - "(?i)\\bCMA[- ]?180\\b"         # 180 upright family
      - "(?i)\\bupright\\b|\\bdoor\\s*type\\b"
    Undercounter:
      - "(?i)\\bUC(50E|65E)\\b"
      - "(?i)\\bL[- ]?1X\\b"
      - "(?i)\\bundercounter\\b"
    Prep Washer:
      - "(?i)\\bpot\\s*washer\\b|\\bpot\\s*&\\s*pan\\b|\\bscullery\\b"

